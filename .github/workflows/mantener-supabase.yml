# Visita automática a Supabase TODOS LOS DÍAS. El plan gratis pausa el proyecto tras
# ~7 días sin uso (y la app deja de conectar); una consulta real a la base lo evita.
# Se hace a diario para tener margen si GitHub se salta alguna ejecución.
# Usa la clave pública (anon) del environment "production": solo pregunta si hay usuarios.
#
# GitHub apaga las tareas programadas de un repositorio con 60 días sin cambios: el
# segundo trabajo registra una "visita" en .github/actividad.txt cuando llevan más de
# 40 días sin commits, para que esta tarea nunca se apague sola.
name: Mantener Supabase activo

on:
  schedule:
    # 09:17 UTC todos los días
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  visitar:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Consultar la base
        env:
          URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          CLAVE: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$CLAVE" ]; then
            echo "::error::Faltan SUPABASE_URL y SUPABASE_ANON_KEY (secretos del environment production)."; exit 1
          fi
          for intento in 1 2 3 4 5; do
            codigo=$(curl -sS -o respuesta.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/hay_usuarios" \
              -H "apikey: $CLAVE" -H "Authorization: Bearer $CLAVE" -H "Content-Type: application/json" -d '{}' || echo 000)
            if [ "$codigo" = "200" ]; then echo "Supabase respondió: $(cat respuesta.txt)"; exit 0; fi
            echo "Intento $intento: HTTP $codigo $(cat respuesta.txt 2>/dev/null)"; sleep 30
          done
          echo "::error::Supabase no respondió. Si el proyecto quedó pausado, reactívalo en el panel de Supabase (Restore project)."
          exit 1

  mantener-repositorio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Registrar actividad si hace falta
        shell: bash
        run: |
          ultimo=$(git log -1 --format=%ct)
          dias=$(( ( $(date +%s) - ultimo ) / 86400 ))
          echo "Último cambio hace $dias días."
          if [ "$dias" -lt 40 ]; then exit 0; fi
          date -u +"Última visita automática: %Y-%m-%d %H:%M UTC" > .github/actividad.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/actividad.txt
          git commit -m "Actividad automática (mantiene activas las tareas programadas)"
          git push
