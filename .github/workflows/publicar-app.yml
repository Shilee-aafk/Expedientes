# Compila el instalador de Windows y lo publica como Release de este repositorio.
# Se activa al subir una etiqueta vX.Y.Z (ver scripts/publicar-version.mjs).
name: Publicar app de escritorio

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Permiso para crear la Release con el token propio de GitHub Actions (sin tokens extra)
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Verificar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "La etiqueta ${GITHUB_REF_NAME} no coincide con la versión v$VERSION de electron/package.json"; exit 1
          fi

      - name: Instalar dependencias
        run: |
          npm ci
          npm ci --prefix electron

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: |
          npm run build
          npm run app:preparar

      - name: Crear instalador y publicarlo
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
