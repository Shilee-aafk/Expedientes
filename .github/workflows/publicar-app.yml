# Compila el instalador de Windows y lo publica como Release de este repositorio.
# Se activa cuando cambia la versión (electron/package.json; ver `npm run publicar`).
# Si la Release de esa versión ya existe, no hace nada.
name: Publicar app de escritorio

on:
  push:
    paths:
      - electron/package.json
      - .github/workflows/publicar-app.yml
  workflow_dispatch:

# Crear la etiqueta y la Release con el token propio de GitHub Actions (sin tokens extra)
permissions:
  contents: write

concurrency:
  group: publicar-app
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    # Los datos de Supabase están como secretos del environment "production"
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: ¿Hay una versión nueva?
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "v$VERSION" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "La versión v$VERSION ya está publicada: nada que hacer."
            echo "publicar=no" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.version.outputs.publicar == 'si'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.publicar == 'si'
        with:
          dotnet-version: 8.0.x

      - name: Instalar dependencias
        if: steps.version.outputs.publicar == 'si'
        run: |
          npm ci
          npm ci --prefix electron

      - name: Pruebas
        if: steps.version.outputs.publicar == 'si'
        run: |
          npm test
          dotnet test plugin/Pruebas --nologo

      - name: Compilar
        if: steps.version.outputs.publicar == 'si'
        # Datos del proyecto de Supabase: secretos del environment "production" (o variables del repositorio)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan SUPABASE_URL y SUPABASE_ANON_KEY (secretos del environment production)."; exit 1
          fi
          npm run build
          npm run app:preparar
          node scripts/preparar-plugin.mjs

      - name: Etiquetar la versión
        if: steps.version.outputs.publicar == 'si'
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # La Release se crea antes, como borrador: si la creara electron-builder, sus
      # publicadores en paralelo pueden crear dos Releases con la misma etiqueta.
      - name: Preparar la Release (borrador)
        if: steps.version.outputs.publicar == 'si'
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --title "${{ steps.version.outputs.version }}" --notes "Versión ${{ steps.version.outputs.version }}"

      - name: Crear instalador y subirlo
        if: steps.version.outputs.publicar == 'si'
        run: npx electron-builder --win --publish always

      - name: Publicar la Release
        if: steps.version.outputs.publicar == 'si'
        shell: bash
        run: gh release edit "v${{ steps.version.outputs.version }}" --draft=false --latest
