# Compila el instalador de Windows y lo publica como Release de este repositorio.
# Se activa cuando cambia la versión (electron/package.json; ver `npm run publicar`).
# Si la Release de esa versión ya existe, no hace nada.
name: Publicar app de escritorio

on:
  push:
    paths:
      - electron/package.json
      - .github/workflows/publicar-app.yml
  workflow_dispatch:

# Crear la etiqueta y la Release con el token propio de GitHub Actions (sin tokens extra)
permissions:
  contents: write

concurrency:
  group: publicar-app
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay una versión nueva?
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "La versión v$VERSION ya está publicada: nada que hacer."
            echo "publicar=no" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.publicar == 'si'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Instalar dependencias
        if: steps.version.outputs.publicar == 'si'
        run: |
          npm ci
          npm ci --prefix electron

      - name: Pruebas
        if: steps.version.outputs.publicar == 'si'
        run: npm test

      - name: Compilar
        if: steps.version.outputs.publicar == 'si'
        run: |
          npm run build
          npm run app:preparar

      - name: Etiquetar la versión
        if: steps.version.outputs.publicar == 'si'
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Crear instalador y publicarlo
        if: steps.version.outputs.publicar == 'si'
        run: npx electron-builder --win --publish always
