# App de escritorio para Windows: instalador .exe (NSIS) con actualizaciones automáticas.
# Lo compila y publica GitHub Actions (.github/workflows/publicar-app.yml) al subir una etiqueta vX.Y.Z.
appId: cl.spproyectos.expedientes
productName: Expedientes SPR
electronVersion: 45.1.0
directories:
  app: electron          # proceso principal + electron-updater; el servidor va como recurso aparte
  output: dist-app
  buildResources: electron
files:
  - main.cjs
  - preload.cjs
  - icono.png
  - package.json
# Sin módulos nativos: no reconstruir nada
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
extraResources:
  # Desde .next (no desde .next/standalone): electron-builder siempre descarta el
  # node_modules de la raíz del origen, y el servidor lo necesita.
  - from: .next
    to: .
    filter:
      - "standalone/**/*"
      - "standalone/node_modules/**/*"
      - "!standalone/datos/**"
asar: true
# Tamaño: solo español e inglés (Electron trae ~55 idiomas) y compresión máxima
electronLanguages: [es, es-419, en-US]
compression: maximum
win:
  target:
    - target: nsis
      arch: [x64]
  icon: electron/icono.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Expedientes SPR
  artifactName: "Expedientes-SPR-Instalador-${version}.exe"
  installerIcon: electron/icono.ico
  uninstallerIcon: electron/icono.ico
  installerHeaderIcon: electron/icono.ico
  installerLanguages: [es_ES]
  language: "3082"
  # Al desinstalar NO se borran los datos (%APPDATA%\Expedientes SPR)
  deleteAppDataOnUninstall: false
# Las versiones se publican como "Releases" de este mismo repositorio (público):
# la app descarga de ahí sin necesitar ninguna clave.
publish:
  provider: github
  owner: Shilee-aafk
  repo: Expedientes
  # El workflow crea la Release como borrador y la publica cuando están todos los archivos
  releaseType: draft
